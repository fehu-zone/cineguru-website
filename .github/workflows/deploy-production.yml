name: Deploy production candidate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cineguru-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, verify and deploy
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build standalone application
        run: npm run build

      - name: Test rendered output
        run: node --test tests/rendered-html.test.mjs

      - name: Reject critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=critical

      - name: Create minimal deployment archive
        shell: bash
        run: |
          set -Eeuo pipefail
          package_root="$RUNNER_TEMP/cineguru-package"
          archive="$RUNNER_TEMP/cineguru-${GITHUB_SHA}.tgz"
          mkdir -p "$package_root/.next"
          cp -a .next/standalone/. "$package_root/"
          cp -a .next/static "$package_root/.next/static"
          cp -a public "$package_root/public"
          printf 'commit=%s\nrun_id=%s\ncreated_utc=%s\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$(date -u +%FT%TZ)" \
            > "$package_root/DEPLOY-METADATA"

          if find "$package_root" -type f \
            \( -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' \) \
            -print -quit | grep -q .; then
            echo 'A private credential-like file entered the deployment package.' >&2
            exit 1
          fi

          tar -C "$package_root" -czf "$archive" .
          tar -tzf "$archive" >/dev/null
          sha256sum "$archive"
          echo "CINEGURU_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Configure pinned SSH host identity
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.CINEGURU_DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ secrets.CINEGURU_DEPLOY_HOST_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/cineguru_deploy"
          printf '%s\n' "$HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/cineguru_deploy" "$HOME/.ssh/known_hosts"

      - name: Upload and activate candidate
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.CINEGURU_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.CINEGURU_DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          archive_name="cineguru-${GITHUB_SHA}-${GITHUB_RUN_ID}.tgz"
          ssh_options=(
            -i "$HOME/.ssh/cineguru_deploy"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "upload $archive_name" < "$CINEGURU_ARCHIVE"
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy $archive_name"

      - name: Remove ephemeral SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/cineguru_deploy"
