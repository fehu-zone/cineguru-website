name: Verify production deployment

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-if-stale:
    name: Dispatch deploy when main is ahead
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch a deploy for an unshipped main commit
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'deploy-production.yml',
              branch: 'main',
              per_page: 20,
            });
            const activeRun = runs.data.workflow_runs.find((run) => ['queued', 'in_progress', 'waiting', 'requested', 'pending'].includes(run.status));
            if (activeRun) {
              core.info(`Deploy already active: ${activeRun.html_url}`);
              return;
            }

            const latestSuccessfulRun = runs.data.workflow_runs.find(
              (run) => run.status === 'completed' && run.conclusion === 'success',
            );
            const deployedSha = latestSuccessfulRun?.head_sha ?? '';
            const mainSha = branch.data.commit.sha;
            if (deployedSha === mainSha) {
              core.info(`Production is current at ${mainSha}.`);
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'deploy-production.yml',
              ref: 'main',
            });
            core.notice(`Dispatched deploy for main at ${mainSha}.`);
