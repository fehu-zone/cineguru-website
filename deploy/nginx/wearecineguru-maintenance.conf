server {
    listen 80;
    listen [::]:80;
    server_name wearecineguru.com www.wearecineguru.com;
    return 301 https://www.wearecineguru.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wearecineguru.com www.wearecineguru.com;

    ssl_certificate /etc/letsencrypt/live/wearecineguru.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wearecineguru.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/cineguru/maintenance;
    index index.html;

    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location / {
        try_files /index.html =404;
    }

    location ~* \.(?:php|phtml|phar)$ {
        return 404;
    }
}
